version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: satquery-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - satquery-network

  # Python ML Model Serving Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: satquery-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ML_HOST=0.0.0.0
      - ML_PORT=8000
    networks:
      - satquery-network

  # Node.js Agentic Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satquery-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/satquery
      - PYTHON_ML_URL=http://ml-service:8000
      - AI_PROVIDER=gemini
    depends_on:
      - mongodb
      - ml-service
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - satquery-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: satquery-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - satquery-network

networks:
  satquery-network:
    driver: bridge

volumes:
  mongodb_data:
